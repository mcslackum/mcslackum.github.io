---
layout: default
---
<article>
  <header class="post-header">
    <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <a href="{{ '/' | relative_url }}" class="back-link">← back</a>
</article>
